name: Quality

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: "true"
  GOWORK: "off"
  PNPM_VERSION: 11.18.0
  STATICCHECK_VERSION: "2026.1"
  ACTIONLINT_VERSION: v1.7.12

jobs:
  quality:
    name: Tests and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        working-directory: frontend
        run: pnpm run format:check

      - name: Check frontend types
        working-directory: frontend
        run: pnpm run check

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm run test

      - name: Build embedded frontend assets
        working-directory: frontend
        run: pnpm run build

      - name: Cache Go analysis tools
        id: analysis-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin/actionlint
            ~/go/bin/staticcheck
          key: analysis-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.STATICCHECK_VERSION }}-${{ env.ACTIONLINT_VERSION }}

      - name: Install Go analysis tools
        if: steps.analysis-tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Run Go race tests
        if: github.event_name == 'push'
        run: go test -race ./... -count=1

      - name: Run go vet
        run: go vet ./...

      - name: Run Staticcheck
        run: staticcheck ./...

      - name: Lint GitHub Actions workflows
        run: actionlint
